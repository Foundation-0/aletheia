[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-method"
version = "1.2.0"
description = "The Aletheia Method: zero-dependency CLI for Portal-Driven Resonance, R1-R5 Adversarial Tomography, AST refusal-site mutation testing, and Anti-Cave diagnostics."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []
keywords = ["scientific-discovery", "formal-verification", "mutation-testing", "multi-agent", "aletheia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Foundation-0/aletheia"
Repository = "https://github.com/Foundation-0/aletheia"

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aletheia*"]
